[theme]
primaryColor = "#10B981"
backgroundColor = "#131314"
secondaryBackgroundColor = "#1E1F22"
textColor = "#E3E3E3"
font = "sans serif"

[client]
showErrorDetails = true
showSidebarNavigation = true
toolbarMode = "minimal"

[server]
headless = true
port = 8501
maxUploadSize = 200
enableCORS = true
enableXsrfProtection = true

[logger]
level = "info"

[ui]
hideTopBar = false
hideFooter = false

# Performance
[client]
caching = true

# Development
[cli]
showErrorDetails = true
telemetry.enabled = false
